[project]
name = "nosteam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yenderson Uribe", email = "yendersonuribe@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.4",
]

[project.scripts]
nosteam = "nosteam:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-web>=1.0.4",
]
